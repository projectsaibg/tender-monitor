{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>Settings</h1></div>
<form class="form" method="post" action="/settings">
  <section class="panel">
    <h2>General</h2>
    <div class="form-grid">
      <label>Timezone (IANA, e.g. Asia/Kolkata)
        <input type="text" name="timezone" value="{{ settings.timezone }}" placeholder="Asia/Kolkata">
      </label>
    </div>
  </section>

  <section class="panel">
    <h2>Email Notifications (optional)</h2>
    <div class="form-grid">
      <label>SMTP Host<input type="text" name="smtp_host" value="{{ settings.smtp_host }}"></label>
      <label>SMTP Port<input type="text" name="smtp_port" value="{{ settings.smtp_port }}"></label>
      <label>SMTP Username<input type="text" name="smtp_username" value="{{ settings.smtp_username }}"></label>
      <label>SMTP Password<input type="password" name="smtp_password" value="{{ settings.smtp_password }}" autocomplete="new-password"></label>
      <label>From Email<input type="email" name="email_from" value="{{ settings.email_from }}"></label>
      <label>To Email<input type="email" name="email_to" value="{{ settings.email_to }}"></label>
      <label>Use TLS<span class="checkline"><input type="checkbox" name="smtp_use_tls" {{ "checked" if settings.smtp_use_tls == "1" else "" }}> Enable STARTTLS</span></label>
    </div>
    <div class="form-grid">
      <label>Enable notifications<span class="checkline"><input type="checkbox" name="notify_enabled" {{ "checked" if settings.notify_enabled == "1" else "" }}> On</span></label>
      <label>Only if new tenders<span class="checkline"><input type="checkbox" name="notify_only_if_new" {{ "checked" if settings.notify_only_if_new == "1" else "" }}> On</span></label>
      <label>Only high relevance<span class="checkline"><input type="checkbox" name="notify_only_high_relevance" {{ "checked" if settings.notify_only_high_relevance == "1" else "" }}> On</span></label>
      <label>Only errors<span class="checkline"><input type="checkbox" name="notify_only_errors" {{ "checked" if settings.notify_only_errors == "1" else "" }}> On</span></label>
      <label>Attach Excel<span class="checkline"><input type="checkbox" name="notify_attach_excel" {{ "checked" if settings.notify_attach_excel == "1" else "" }}> On</span></label>
    </div>
  </section>

  <div class="form-actions"><button type="submit" class="btn primary">Save Settings</button></div>
</form>
<p class="muted">Credentials are stored locally in the SQLite database and never written to logs.</p>
{% endblock %}
